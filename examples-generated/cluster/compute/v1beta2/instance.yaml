apiVersion: compute.gcp.upbound.io/v1beta2
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1beta2/instance
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    bootDisk:
    - initializeParams:
      - imageSelector:
          matchLabels:
            testing.upbound.io/example-name: example
        labels:
          my_label: value
    machineType: n2-standard-2
    metadata:
      foo: bar
    metadataStartupScript: echo hi > /test.txt
    networkInterface:
    - accessConfig:
      - {}
      networkSelector:
        matchLabels:
          testing.upbound.io/example-name: example
    scratchDisk:
    - interface: NVME
    serviceAccount:
    - email: ${google_service_account.default.email}
      scopes:
      - cloud-platform
    tags:
    - foo
    - bar
    zone: us-central1-a
