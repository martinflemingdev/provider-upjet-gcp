apiVersion: discoveryengine.gcp.upbound.io/v1beta1
kind: Schema
metadata:
  annotations:
    meta.upbound.io/example-id: discoveryengine/v1beta1/schema
  labels:
    testing.upbound.io/example-name: basic
  name: basic
spec:
  forProvider:
    dataStoreIdSelector:
      matchLabels:
        testing.upbound.io/example-name: basic
    jsonSchema: '{"$schema":"https://json-schema.org/draft/2020-12/schema","datetime_detection":true,"type":"object","geolocation_detection":true}'
    locationSelector:
      matchLabels:
        testing.upbound.io/example-name: basic

---

apiVersion: discoveryengine.gcp.upbound.io/v1beta1
kind: DataStore
metadata:
  annotations:
    meta.upbound.io/example-id: discoveryengine/v1beta1/schema
  labels:
    testing.upbound.io/example-name: basic
  name: basic
spec:
  forProvider:
    contentConfig: NO_CONTENT
    createAdvancedSiteSearch: false
    displayName: tf-test-structured-datastore
    industryVertical: GENERIC
    location: global
    skipDefaultSchemaCreation: true
    solutionTypes:
    - SOLUTION_TYPE_SEARCH
