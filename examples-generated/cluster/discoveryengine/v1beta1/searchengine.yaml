apiVersion: discoveryengine.gcp.upbound.io/v1beta1
kind: SearchEngine
metadata:
  annotations:
    meta.upbound.io/example-id: discoveryengine/v1beta1/searchengine
  labels:
    testing.upbound.io/example-name: basic
  name: basic
spec:
  forProvider:
    collectionId: default_collection
    dataStoreIdsRefs:
    - name: basic
    displayName: Example Display Name
    locationSelector:
      matchLabels:
        testing.upbound.io/example-name: basic
    searchEngineConfig: {}

---

apiVersion: discoveryengine.gcp.upbound.io/v1beta1
kind: DataStore
metadata:
  annotations:
    meta.upbound.io/example-id: discoveryengine/v1beta1/searchengine
  labels:
    testing.upbound.io/example-name: basic
  name: basic
spec:
  forProvider:
    contentConfig: NO_CONTENT
    createAdvancedSiteSearch: false
    displayName: tf-test-structured-datastore
    industryVertical: GENERIC
    location: global
    solutionTypes:
    - SOLUTION_TYPE_SEARCH
