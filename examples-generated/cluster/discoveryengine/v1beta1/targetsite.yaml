apiVersion: discoveryengine.gcp.upbound.io/v1beta1
kind: TargetSite
metadata:
  annotations:
    meta.upbound.io/example-id: discoveryengine/v1beta1/targetsite
  labels:
    testing.upbound.io/example-name: basic
  name: basic
spec:
  forProvider:
    dataStoreIdSelector:
      matchLabels:
        testing.upbound.io/example-name: basic
    exactMatch: false
    locationSelector:
      matchLabels:
        testing.upbound.io/example-name: basic
    providedUriPattern: cloud.google.com/docs/*
    type: INCLUDE

---

apiVersion: discoveryengine.gcp.upbound.io/v1beta1
kind: DataStore
metadata:
  annotations:
    meta.upbound.io/example-id: discoveryengine/v1beta1/targetsite
  labels:
    testing.upbound.io/example-name: basic
  name: basic
spec:
  forProvider:
    contentConfig: PUBLIC_WEBSITE
    createAdvancedSiteSearch: false
    displayName: tf-test-basic-site-search-datastore
    industryVertical: GENERIC
    location: global
    skipDefaultSchemaCreation: false
    solutionTypes:
    - SOLUTION_TYPE_SEARCH
