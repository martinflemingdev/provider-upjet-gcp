apiVersion: accessapproval.gcp.m.upbound.io/v1beta1
kind: OrganizationSettings
metadata:
  annotations:
    meta.upbound.io/example-id: accessapproval/v1beta1/organizationsettings
  labels:
    testing.upbound.io/example-name: organization_access_approval
  name: organization-access-approval
  namespace: upbound-system
spec:
