apiVersion: billing.gcp.m.upbound.io/v1beta1
kind: Budget
metadata:
  annotations:
    meta.upbound.io/example-id: billing/v1beta1/budget
  labels:
    testing.upbound.io/example-name: budget
  name: budget
  namespace: upbound-system
spec:
  forProvider:
    amount:
      specifiedAmount:
        currencyCode: USD
        units: "100000"
    billingAccount: ${data.google_billing_account.account.id}
    displayName: Example Billing Budget
    thresholdRules:
    - thresholdPercent: 0.5
