apiVersion: billing.gcp.m.upbound.io/v1beta1
kind: ProjectInfo
metadata:
  annotations:
    meta.upbound.io/example-id: billing/v1beta1/projectinfo
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: upbound-system
spec:
  forProvider:
    billingAccount: 000000-0000000-0000000-000000
    projectSelector:
      matchLabels:
        testing.upbound.io/example-name: project

---

apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
kind: Project
metadata:
  annotations:
    meta.upbound.io/example-id: billing/v1beta1/projectinfo
  labels:
    testing.upbound.io/example-name: project
  name: project
  namespace: upbound-system
spec:
  forProvider:
    deletionPolicy: DELETE
    name: tf-test
    orgId: "123456789"
    projectId: tf-test
