apiVersion: dataform.gcp.m.upbound.io/v1beta1
kind: Repository
metadata:
  annotations:
    meta.upbound.io/example-id: dataform/v1beta1/repository
  labels:
    testing.upbound.io/example-name: dataform_repository
  name: dataform-repository
  namespace: upbound-system
spec:
  forProvider:
    displayName: dataform_repository
    gitRemoteSettings:
      authenticationTokenSecretVersionSelector:
        matchLabels:
          testing.upbound.io/example-name: secret_version
      defaultBranch: main
      url: https://github.com/OWNER/REPOSITORY.git
    kmsKeyNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example_key
    labels:
      label_foo1: label-bar1
    npmrcEnvironmentVariablesSecretVersionSelector:
      matchLabels:
        testing.upbound.io/example-name: secret_version
    workspaceCompilationOverrides:
      defaultDatabase: database
      schemaSuffix: _suffix
      tablePrefix: prefix_

---

apiVersion: kms.gcp.m.upbound.io/v1beta1
kind: CryptoKey
metadata:
  annotations:
    meta.upbound.io/example-id: dataform/v1beta1/repository
  labels:
    testing.upbound.io/example-name: example_key
  name: example-key
  namespace: upbound-system
spec:
  forProvider:
    keyRingSelector:
      matchLabels:
        testing.upbound.io/example-name: keyring

---

apiVersion: kms.gcp.m.upbound.io/v1beta1
kind: KeyRing
metadata:
  annotations:
    meta.upbound.io/example-id: dataform/v1beta1/repository
  labels:
    testing.upbound.io/example-name: keyring
  name: keyring
  namespace: upbound-system
spec:
  forProvider:
    location: us-central1

---

apiVersion: secretmanager.gcp.m.upbound.io/v1beta1
kind: Secret
metadata:
  annotations:
    meta.upbound.io/example-id: dataform/v1beta1/repository
  labels:
    testing.upbound.io/example-name: secret
  name: secret
  namespace: upbound-system
spec:
  forProvider:
    replication:
      auto: {}

---

apiVersion: secretmanager.gcp.m.upbound.io/v1beta1
kind: SecretVersion
metadata:
  annotations:
    meta.upbound.io/example-id: dataform/v1beta1/repository
  labels:
    testing.upbound.io/example-name: secret_version
  name: secret-version
  namespace: upbound-system
spec:
  forProvider:
    secretDataSecretRef:
      key: example-key
      name: example-secret
    secretSelector:
      matchLabels:
        testing.upbound.io/example-name: secret
