apiVersion: discoveryengine.gcp.m.upbound.io/v1beta1
kind: Assistant
metadata:
  annotations:
    meta.upbound.io/example-id: discoveryengine/v1beta1/assistant
  labels:
    testing.upbound.io/example-name: basic
  name: basic
  namespace: upbound-system
spec:
  forProvider:
    collectionId: default_collection
    customerPolicy:
      bannedPhrases:
      - ignoreDiacritics: false
        matchType: SIMPLE_STRING_MATCH
        phrase: foo
    description: Assistant Description
    displayName: updated-tf-test-Assistant
    engineIdSelector:
      matchLabels:
        testing.upbound.io/example-name: basic
    generationConfig:
      defaultLanguage: en
      systemInstruction:
        additionalSystemInstruction: foobar
    location: global
    webGroundingType: WEB_GROUNDING_TYPE_GOOGLE_SEARCH

---

apiVersion: discoveryengine.gcp.m.upbound.io/v1beta1
kind: DataStore
metadata:
  annotations:
    meta.upbound.io/example-id: discoveryengine/v1beta1/assistant
  labels:
    testing.upbound.io/example-name: basic
  name: basic
  namespace: upbound-system
spec:
  forProvider:
    contentConfig: NO_CONTENT
    createAdvancedSiteSearch: false
    displayName: tf-test-structured-datastore
    industryVertical: GENERIC
    location: global
    solutionTypes:
    - SOLUTION_TYPE_SEARCH

---

apiVersion: discoveryengine.gcp.m.upbound.io/v1beta1
kind: SearchEngine
metadata:
  annotations:
    meta.upbound.io/example-id: discoveryengine/v1beta1/assistant
  labels:
    testing.upbound.io/example-name: basic
  name: basic
  namespace: upbound-system
spec:
  forProvider:
    collectionId: default_collection
    dataStoreIdsRefs:
    - name: basic
    displayName: Example Display Name
    locationSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    searchEngineConfig: {}
