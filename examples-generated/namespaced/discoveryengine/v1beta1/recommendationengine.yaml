apiVersion: discoveryengine.gcp.m.upbound.io/v1beta1
kind: RecommendationEngine
metadata:
  annotations:
    meta.upbound.io/example-id: discoveryengine/v1beta1/recommendationengine
  labels:
    testing.upbound.io/example-name: generic
  name: generic
  namespace: upbound-system
spec:
  forProvider:
    commonConfig:
      companyName: test-company
    dataStoreIdsRefs:
    - name: generic
    displayName: Example Recommendation Engine
    industryVertical: GENERIC
    locationSelector:
      matchLabels:
        testing.upbound.io/example-name: generic

---

apiVersion: discoveryengine.gcp.m.upbound.io/v1beta1
kind: DataStore
metadata:
  annotations:
    meta.upbound.io/example-id: discoveryengine/v1beta1/recommendationengine
  labels:
    testing.upbound.io/example-name: generic
  name: generic
  namespace: upbound-system
spec:
  forProvider:
    contentConfig: NO_CONTENT
    createAdvancedSiteSearch: false
    displayName: tf-test-structured-datastore
    industryVertical: GENERIC
    location: global
    skipDefaultSchemaCreation: false
    solutionTypes:
    - SOLUTION_TYPE_RECOMMENDATION
