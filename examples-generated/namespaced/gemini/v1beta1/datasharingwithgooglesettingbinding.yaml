apiVersion: gemini.gcp.m.upbound.io/v1beta1
kind: DataSharingWithGoogleSettingBinding
metadata:
  annotations:
    meta.upbound.io/example-id: gemini/v1beta1/datasharingwithgooglesettingbinding
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    dataSharingWithGoogleSettingIdSelector:
      matchLabels:
        testing.upbound.io/example-name: basic
    location: global
    target: projects/980109375338

---

apiVersion: gemini.gcp.m.upbound.io/v1beta1
kind: DataSharingWithGoogleSetting
metadata:
  annotations:
    meta.upbound.io/example-id: gemini/v1beta1/datasharingwithgooglesettingbinding
  labels:
    testing.upbound.io/example-name: basic
  name: basic
  namespace: upbound-system
spec:
  forProvider:
    enableDataSharing: true
    enablePreviewDataSharing: true
    labels:
      my_key: my_value
    location: global
