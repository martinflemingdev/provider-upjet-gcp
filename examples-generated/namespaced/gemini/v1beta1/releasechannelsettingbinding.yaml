apiVersion: gemini.gcp.m.upbound.io/v1beta1
kind: ReleaseChannelSettingBinding
metadata:
  annotations:
    meta.upbound.io/example-id: gemini/v1beta1/releasechannelsettingbinding
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: upbound-system
spec:
  forProvider:
    location: global
    releaseChannelSettingIdSelector:
      matchLabels:
        testing.upbound.io/example-name: basic
    target: projects/980109375338

---

apiVersion: gemini.gcp.m.upbound.io/v1beta1
kind: ReleaseChannelSetting
metadata:
  annotations:
    meta.upbound.io/example-id: gemini/v1beta1/releasechannelsettingbinding
  labels:
    testing.upbound.io/example-name: basic
  name: basic
  namespace: upbound-system
spec:
  forProvider:
    labels:
      my_key: my_value
    location: global
    releaseChannel: EXPERIMENTAL
