                      'EUA', 'FEDERATED_AND_EUA'.
                    items:
                      type: string
                    type: array
                  dataSource:
                    description: |-
                      The name of the data source.
                      Supported values: salesforce, jira, confluence, bigquery.
                    type: string
                  entities:
                    description: |-
                      List of entities from the connected data source to ingest.
                      Structure is documented below.
                    items:
                      properties:
                        entityName:
                          description: 'The name of the entity. Supported values by
                            data source:'
                          type: string
                        keyPropertyMappings:
                          additionalProperties:
                            type: string
                          description: |-
                            Attributes for indexing.
                            Key: Field name.
                            Value: The key property to map a field to, such as title, and
                            description. Supported key properties:
                          type: object
                          x-kubernetes-map-type: granular
                        params:
                          description: The parameters for the entity to facilitate
                            data ingestion.
                          type: string
