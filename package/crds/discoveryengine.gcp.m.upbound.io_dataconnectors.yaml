          metadata:
            type: object
          spec:
            description: DataConnectorSpec defines the desired state of DataConnector
            properties:
              forProvider:
                properties:
                  autoRunDisabled:
                    description: Indicates whether full syncs are paused for this
                      connector
                    type: boolean
                  collectionDisplayName:
                    description: |-
                      The display name of the Collection.
                      Should be human readable, used to display collections in the Console
                      Dashboard. UTF-8 encoded string with limit of 1024 characters.
                    type: string
                  connectorModes:
                    description: |-
                      The modes enabled for this connector. The possible value can be:
