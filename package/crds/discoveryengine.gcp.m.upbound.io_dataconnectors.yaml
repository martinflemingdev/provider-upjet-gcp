                          type: string
                      type: object
                    type: array
                  errors:
                    description: |-
                      The errors from initialization or from the latest connector run.
                      Structure is documented below.
                    items:
                      properties:
                        code:
                          description: |-
                            (Output)
                            The status code, which should be an enum value of google.rpc.Code.
                          type: number
                        message:
                          description: |-
                            (Output)
                            A developer-facing error message, which should be in English.
                          type: string
                      type: object
                    type: array
                  id:
                    description: an identifier for the resource with format projects/{{project}}/locations/{{location}}/collections/{{collection_id}}/dataConnector
                    type: string
