                    type: boolean
                  syncMode:
                    description: |-
                      The data synchronization mode supported by the data connector. The possible value can be:
                      'PERIODIC', 'STREAMING'.
                    type: string
                  updateTime:
                    description: Timestamp when the DataConnector was updated.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
