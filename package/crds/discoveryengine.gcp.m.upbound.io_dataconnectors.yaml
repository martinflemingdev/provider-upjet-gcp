                    type: string
                  autoRunDisabled:
                    description: Indicates whether full syncs are paused for this
                      connector
                    type: boolean
                  blockingReasons:
                    description: |-
                      User actions that must be completed before the connector can start syncing data.
                      The possible values can be: 'ALLOWLIST_STATIC_IP', 'ALLOWLIST_IN_SERVICE_ATTACHMENT'.
                    items:
                      type: string
                    type: array
                  collectionDisplayName:
                    description: |-
                      The display name of the Collection.
                      Should be human readable, used to display collections in the Console
