                      If this field is set and processed successfully, the DataStores created by
                      this connector will be protected by the KMS key.
                    type: string
                  lastSyncTime:
                    description: For periodic connectors only, the last time a data
                      sync was completed.
                    type: string
                  latestPauseTime:
                    description: |-
                      The most recent timestamp when this [DataConnector][] was paused,
                      affecting all functionalities such as data synchronization.
                      Pausing a connector has the following effects:
                    type: string
                  location:
                    description: |-
                      The geographic location where the data store should reside. The value can
